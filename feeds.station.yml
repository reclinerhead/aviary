# =============================================================================
# project-squirrel -- feeds.station.yml (issue #302, epic #212)
#
# The STATION feed registry: what a standalone Aviary station's Earl listens
# to. A station's env file points MERLE_FEEDS at this file (see
# station.env.example), so the committed feeds.yml -- the HOME registry, full
# of this house's cameras and rover -- is bypassed entirely, never edited.
#
# One feed: the station's own microphone, captured locally with arecord (the
# rover's `command` kind minus the ssh -- same s16le/48kHz/mono contract on
# stdout). Birdhouse's current dongle is a Creative Sound Blaster Play! 3
# (USB 041e:324d, ALSA id S3) + Movo lavalier — replaced the SABRENT
# AU-UCMA / C-Media (0d8c:0147, ALSA id Device) on 2026-08-13 after that
# card died. Native 48 kHz mono S16_LE via plughw.
#
# The device is addressed BY NAME (CARD=S3), never by index (#320):
# ALSA card indices are a boot-time race, and birdhouse's first cold boot
# in the field flipped the USB dongle from card 1 to card 0 -- a `plughw:1,0`
# capture then opens the onboard HDA jack (nothing plugged in), which
# produces perfectly healthy-looking near-zero samples: worker up, no
# error, station deaf, and only the honest `silent` state to show for it.
# `CARD=S3` is this dongle's ALSA name (`card N: S3 [Sound Blaster Play! 3]`),
# stable across enumeration order. A future card swap is a rename here
# (and in toddtech-infrastructure/servers/Birdhouse.md § The mic), not an index hunt.
#
# `-B 2000000` (arecord --buffer-time, microseconds; #607) is the capture's
# slack. A worker reads one 3 s window, then classifies it, and meanwhile the
# next window waits in the 64 KiB pipe (~0.68 s) plus ALSA's buffer.
# arecord's default 0.5 s buffer left ~1.2 s, which a one-worker station at
# schedutil clocks exceeds: birdhouse overran nearly every window from its
# bench build on, each recovery discarding ~0.45 s, and heard 0.867x real
# time -- silently, since -q hides the xrun and the worker drops a command's
# stderr. 2 s gives ~2.7 s. arecord applies it as a "nearest allowed" request,
# so a device that can't hold 2 s gets its largest buffer, never a failed
# open. The tell is /proc/asound/S3/pcm0c/sub0/status: a trigger_time that
# changes means the stream restarted.
#
# The feed name is its published source label, its clip directory under
# MERLE_EARL_CLIPS, and the bird record's `source` column -- renaming it is a
# data migration (#270's runbook). `window-mic` is named for what it will
# stay: the mic in the window facing the feeder.
# =============================================================================

feeds:
  window-mic:
    kind: command
    cmd: arecord -D plughw:CARD=S3,DEV=0 -f S16_LE -r 48000 -c 1 -t raw -q -B 2000000
    earl: true

# =============================================================================
# aviary -- feeds.yml (issue #270)
#
# Every audio feed the house listens to. This is the ONLY place a feed is
# declared -- Earl (feeds.py's caller) dispatches on a feed's `kind`, never
# on its name, so adding camera #3 or retiring a mic is an edit here, not a
# code change. The stations have their own files, feeds.station.yml and
# feeds.kestrel.yml.
#
# Camera credentials live in Frigate's config (issue #247): Frigate holds the
# only sessions to the cameras and republishes them credential-free at
# rtsp://nvr.lan:8554/<name>. nvr.lan is a Pi-hole name for the NVR box, so
# this committed file holds no address and survives the NVR moving.
#
# A feed's name doubles as its published source label (audio/events, the bird
# record's `source` column, the clip directory under MERLE_EARL_CLIPS), so
# renaming one is a data migration -- choose names that will stay.
#
# Kinds:
#   rtsp     -> url  the go2rtc restream; Earl pulls the audio track alone
#   command  -> cmd  a shell capture producing s16le/48kHz/mono on stdout
#                    (the garage mic's MAC lookup; a station's arecord)
#
# Flags (absent = false):
#   earl: true        Earl runs BirdNET on this feed's audio. This flag is
#                     the CPU dial -- flip house-front to false and redeploy
#                     to drop Earl back to one camera, no code change.
#
# Descriptive (issue #612):
#   place: "..."      where this feed listens, in plain English, worded to
#                     read after "the microphone at ..." -- the Aviary's
#                     field notes call each microphone that way.
#   retired_sources:  (top level) a label still in the bird record's
#                     `source` column whose feed is gone, mapped to its
#                     phrase, so old detections are named rightly too.
#
# MERLE_FEEDS points a process at an alternate registry file -- tests, a dev
# variant, or the break-glass direct-camera file for a Frigate that's down
# (see docs/guide/earl.md).
# =============================================================================

feeds:
  # The rear camera, watching the driveway -- Earl's first ear since #172
  # (as "amcrest" before #270).
  house-rear:
    kind: rtsp
    url: rtsp://nvr.lan:8554/house-rear
    earl: true
    place: the back of the house, over the driveway

  # The front-door camera (added by #269).
  house-front:
    kind: rtsp
    url: rtsp://nvr.lan:8554/house-front
    earl: true
    place: the front of the house, by the front door

  # The garage Warbler32 (#589), mounted at the rear of the garage: an
  # ESP32-S3 + USB lav streaming rtsp://<ip>/audio. Found by its MAC on every
  # capture (re)start, the kestrel mechanism (#580, listener/mic_by_mac.py):
  # the board has no mDNS and its DHCP lease has already moved once, so this
  # file holds no address and needs no Pi-hole reservation. The cmd is
  # shlex-split with no shell, so the interpreter is absolute (earl-listener's
  # own venv); the worker inherits the unit's WorkingDirectory, the checkout,
  # so `-m` resolves. Its predecessor's garage trial (#512) published as
  # `Warbler32`; those rows keep that label.
  garage-rear:
    kind: command
    cmd: /home/todd/earl-venv/bin/python -m listener.mic_by_mac 90:70:69:1a:1b:fc
    earl: true
    place: the back of the garage

# Labels still in the bird record whose feed is gone (issue #612).
#   Warbler32  the garage trial board (#512), Sep 1 to Oct 13, 2026. It
#              carried the Barred Owl almost alone; garage-rear replaced it.
#   rover      the rover's USB-camera mic, pulled over ssh while it sat in
#              the driveway, Jul 18 to Aug 1, 2026 (388 sightings). Earl
#              stopped running it in #375 and the rover belongs to MERLE now;
#              the feed left this file in #691.
retired_sources:
  Warbler32: the back of the garage
  rover: the rover, parked in the driveway

# The yard, in the owner's words (issue #636): what the field notes may tie
# a bird's habits to. It describes the place, never the microphones (the
# `place:` phrases above are those, and reach a note only as facts), and it
# carries no figures -- anything here counts as "given" to the notes'
# validator.
yard: >-
  A city lot in Kalamazoo, Michigan. The back of the house looks out over a
  large wooded area that falls away to a creek and a small valley, and
  several bird feeders hang in the back yard.

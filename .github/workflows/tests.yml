name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcc
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mcc/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # The station front door (#545) -- its own tiny Next app, its own lockfile.
  frontdoor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontdoor
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontdoor/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The pure-logic suite: Earl's gate, visits, the bird record and the
      # enrichment passes; Willard and the weather archive; the Flyway; the
      # bus and the feed registry; the model clients. CI needs numpy, paho,
      # yaml and pillow but NOT birdnet/tensorflow -- earl.py imports those
      # lazily, inside the workers, so nothing here loads them. Model-, mic-
      # and broker-dependent code stays out of CI, verified on the boxes.
      #
      # THIS LIST IS THE WHOLE CONTRACT: there is no pytest.ini/testpaths
      # fallback, so a test_*.py that isn't named here silently never runs and
      # CI goes green having tested nothing. Add new files by hand. A name
      # whose file is gone fails the job (pytest exit 4) -- the squirrel-only
      # files left this list in #664.
      - run: pip install pytest numpy paho-mqtt pyyaml pillow
      - run: pytest test_feeds.py test_ollama_client.py test_gateway_client.py test_weather.py test_weather_archive.py test_bus.py test_flyway_liveness.py test_listener_gate.py test_listener_sightings.py test_listener_species_profile.py test_listener_fun_facts.py test_listener_species_analysis.py test_listener_notes_validate.py test_listener_solar.py test_listener_region_prior.py test_listener_findings.py test_listener_editor.py test_listener_enrichment_loop.py test_listener_clip_enhance.py test_listener_clip_vocal_fill.py test_listener_clip_showcase.py test_listener_earl.py test_listener_mic_by_mac.py test_flyway_checkin.py -q

# Station bus listeners (epic #212 / Birdhouse.md step 10; ACL issue #534).
#
# Lives on a station (birdhouse, kestrel) as:
#   /etc/mosquitto/conf.d/station.conf
# with the ACL beside it as:
#   /etc/mosquitto/anon-readonly.acl   (from Servers/mosquitto/anon-readonly.acl)
#
# The main mosquitto.conf stays stock (persistence + logging + include_dir);
# don't duplicate keys between the two files -- mosquitto treats duplicates
# as fatal, not last-write-wins.
#
# per_listener_settings must be the first security option in the whole
# config, and it flips allow_anonymous's default to false per listener, so
# it is stated under both. Changing this file needs a restart, not a reload.

per_listener_settings true

# Plain MQTT for the box's own services -- loopback only: every publisher
# and subscriber is local (principle 1), and a station on someone else's
# LAN exposes nothing it doesn't have to.
listener 1883 localhost
protocol mqtt
allow_anonymous true

# WebSockets for the porch lamps + dashboard, LAN-facing: her laptop's
# browser dials ws://<station>:9001 directly (the ":9001" bus key in
# tiles.station.json resolves against the page host, #304). That LAN is
# not ours and anyone on it can open this socket, so anonymous clients
# here subscribe to anything and publish nothing (#534).
listener 9001
protocol websockets
allow_anonymous true
acl_file /etc/mosquitto/anon-readonly.acl
